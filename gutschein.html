<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gutschein</title>
</head>
    <body style="font-family: 'Helvetica Neue';background-size: cover; background-image: url('https://shop.boettcher.ch/data/media/images/products/7090.86.19.jpg'); margin: 0; padding: 0; background-color: #F9F8F8">
        <div style="height: 500px">
            <marquee style="font-size: 40px; color: #F3DE8A; height: 50px" behavior="alternate" bgcolor="#ED6A5A">Herzlichen Glückwunsch!</marquee>
             <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); height: 500px; width: 400px; background-color: #272838; border-radius: 10px; border: 1px solid black;">
                 <h1 style="text-align: center; font-size: 50px; color: #F3DE8A">Gutschein</h1>
                 <p style="text-align: center; color: #F9F8F8">Für einen Glasperlenbrennkurs deiner Wahl!</p>
                 <p style="text-align: center; color: #F9F8F8">Beispielsweise bei: <a style="color: #F9F8F8; text-decoration: none;" href="https://maren-kiss.de/produkt/glasperlendrehen-grundlagenkurs/">Marlen Kiss</a></p>
                 <button style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 30%">Mehr Konfetti!</button>
             </div>
            <marquee behavior="alternate" bgcolor="#ED6A5A" height=50px style="color: #F3DE8A; font-size: 40px; position: fixed; bottom: 0px">Herzlichen Glückwunsch!</marquee>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
        <script>const duration = 15 * 1000,
            animationEnd = Date.now() + duration,
            defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }
        function start() {
            const timeLeft = animationEnd - Date.now();

            if (timeLeft <= 0) {
                return clearInterval(interval);
            }

            const particleCount = 50 * (timeLeft / duration);

            // since particles fall down, start a bit higher than random
            confetti(
                Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                })
            );
            confetti(
                Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                })
            );
        }
        const interval = setInterval(start, 250);

        </script>
    </body>
</html>
